<!doctype html>
<!-- Installer header (inner pages, top right). Rendered by render.sh at 1.5x. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 150px;
        height: 57px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        box-sizing: border-box;
        padding: 0 14px;
        background: #ffffff; /* NSIS header background */
        color: #061414; /* tokens: light foreground */
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img {
        width: 26px;
        height: 26px;
      }
      span {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <img src="mark.svg" alt="" />
    <span>Nod</span>
  </body>
</html>
