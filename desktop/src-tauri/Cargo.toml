[package]
name = "nod-desktop"
version = "0.2.0"
description = "Nod desktop companion: answer Claude Code from a Windows overlay"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "nod_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
# native-tls like the rest of the app (SChannel); v2 updater artifacts need no zip support.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Native TLS = SChannel on Windows: system certificate store, no bundled crypto.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
thiserror = "2"
gethostname = "1"
fastrand = "2"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"
# Same major version as tauri's, so HWND types line up. Used to show the overlay
# without stealing focus and to detect whether the user is at the PC.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
