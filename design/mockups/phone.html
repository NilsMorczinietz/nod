<!doctype html>
<!-- README mockup: a phone frame around a screenshot. Render with scripts/render-mockups.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      .stage {
        width: var(--w, 1400px);
        height: 1240px;
        display: flex;
        gap: 72px;
        align-items: center;
        justify-content: center;
      }
      .phone {
        position: relative;
        width: 520px;
        height: 1156px;
        padding: 14px;
        border-radius: 66px;
        background: linear-gradient(145deg, #1d2626, #070b0b 60%);
        box-shadow:
          inset 0 0 0 2px #2b3636,
          0 2px 4px rgba(6, 46, 46, 0.08),
          0 50px 90px -40px rgba(6, 46, 46, 0.45),
          0 30px 60px -30px rgba(6, 46, 46, 0.25);
      }
      .phone::before,
      .phone::after {
        /* side buttons */
        content: '';
        position: absolute;
        right: -4px;
        width: 4px;
        border-radius: 0 3px 3px 0;
        background: #1a2222;
      }
      .phone::before {
        top: 230px;
        height: 90px;
      }
      .phone::after {
        top: 350px;
        height: 150px;
      }
      .screen {
        width: 100%;
        height: 100%;
        border-radius: 52px;
        overflow: hidden;
        position: relative;
        background: #0b2f30;
      }
      .screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .camera {
        position: absolute;
        top: 26px;
        left: 50%;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        border-radius: 50%;
        background: #050808;
        box-shadow: inset 0 0 0 3px #111a1a;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      // ?shots=a.png,b.png → one phone per screenshot
      const shots = (new URLSearchParams(location.search).get('shots') || 'screen.png').split(',')
      document.documentElement.style.setProperty('--w', `${Math.max(1400, shots.length * 640)}px`)
      document.getElementById('stage').innerHTML = shots
        .map(
          (s) =>
            `<div class="phone"><div class="screen"><img src="${s}"><div class="camera"></div></div></div>`,
        )
        .join('')
    </script>
  </body>
</html>
