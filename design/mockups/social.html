<!doctype html>
<!-- GitHub social preview (1280×640). Render with scripts/render-mockups.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(geist.woff2) format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url(geist-mono.woff2) format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Pixel';
        src: url(geist-pixel.woff2) format('woff2');
      }
      html,
      body {
        margin: 0;
      }
      .card {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #f1f6f6;
        font-family: Geist, sans-serif;
        color: #061414;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 92px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font: 500 28px Geist;
      }
      .brand img {
        width: 44px;
        height: 44px;
      }
      .eyebrow {
        margin-top: 54px;
        display: flex;
        align-items: center;
        gap: 12px;
        font: 500 14px 'Geist Mono';
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #00595a;
      }
      .eyebrow::before {
        content: '';
        width: 28px;
        height: 1px;
        background: rgba(0, 89, 90, 0.35);
      }
      h1 {
        margin: 18px 0 0;
        font-weight: 300;
        font-size: 62px;
        line-height: 1.06;
        letter-spacing: -0.03em;
      }
      p {
        margin: 26px 0 0;
        font-size: 21px;
        line-height: 1.5;
        color: #425b5a;
      }
      .stat {
        position: absolute;
        left: 80px;
        bottom: 70px;
        display: flex;
        gap: 44px;
      }
      .stat div {
        font: 400 13px Geist;
        color: #425b5a;
      }
      .stat b {
        display: block;
        font: 400 30px 'Geist Pixel';
        color: #00595a;
        margin-bottom: 4px;
      }
      .shot {
        position: absolute;
        right: -150px;
        top: 70px;
        width: 820px;
        filter: drop-shadow(0 30px 40px rgba(6, 46, 46, 0.18));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <div class="brand"><img src="logo.svg" alt="" />Nod</div>
        <div class="eyebrow">For Claude Code</div>
        <h1>Approve from your lock screen.</h1>
        <p>Answer Claude Code on your phone and desktop. Self-hosted, free, open source.</p>
      </div>
      <div class="stat">
        <div><b>1 tap</b>to approve or deny</div>
        <div><b>0 €</b>on free tiers</div>
        <div><b>MIT</b>open source</div>
      </div>
      <img class="shot" src="desktop.png" alt="" />
    </div>
  </body>
</html>
