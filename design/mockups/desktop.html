<!doctype html>
<!-- README mockup: a monitor with a teal wallpaper, the island at the top centre and
     optionally the main window. Render with scripts/render-mockups.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .stage {
        width: 1800px;
        height: 1300px;
        display: grid;
        place-items: center;
      }
      .monitor {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .bezel {
        width: 1500px;
        height: 937px;
        padding: 18px;
        border-radius: 26px;
        background: linear-gradient(160deg, #1f2828, #0a0f0f);
        box-shadow:
          inset 0 0 0 2px #2c3838,
          0 60px 100px -50px rgba(6, 46, 46, 0.5),
          0 30px 60px -30px rgba(6, 46, 46, 0.25);
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        overflow: hidden;
        background:
          radial-gradient(1200px 700px at 20% 0%, rgba(196, 232, 228, 0.9), transparent 60%),
          radial-gradient(900px 600px at 90% 100%, rgba(18, 92, 98, 0.95), transparent 70%),
          linear-gradient(170deg, #a9d6d2 0%, #5fa3a3 45%, #2c6e72 100%);
      }
      .island {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: var(--island-w, 560px);
      }
      .island img {
        width: 100%;
        display: block;
      }
      .window {
        position: absolute;
        left: 50%;
        top: 132px;
        transform: translateX(-50%);
        width: var(--window-w, 940px);
        border-radius: 12px;
        overflow: hidden;
        background: #f1f6f6;
        box-shadow:
          0 0 0 1px rgba(6, 20, 20, 0.12),
          0 30px 70px -20px rgba(6, 46, 46, 0.55);
      }
      .titlebar {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: #fafcfc;
        border-bottom: 1px solid #e7ecec;
        font:
          500 13px 'Segoe UI Variable Text',
          'Segoe UI',
          sans-serif;
        color: #425b5a;
      }
      .titlebar .controls {
        margin-left: auto;
        display: flex;
        gap: 22px;
        color: #7b9595;
        font-size: 12px;
      }
      .window img {
        width: 100%;
        display: block;
      }
      .taskbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 44px;
        background: rgba(241, 246, 246, 0.82);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .taskbar span {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: rgba(6, 20, 20, 0.14);
      }
      .taskbar span.nod {
        background: #fff url(mark.svg) center / 70% no-repeat;
        box-shadow: 0 0 0 1px rgba(6, 20, 20, 0.1);
      }
      .neck {
        width: 150px;
        height: 110px;
        background: linear-gradient(#cfd8d8, #b3bfbf);
        clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
      }
      .foot {
        width: 420px;
        height: 16px;
        border-radius: 8px 8px 4px 4px;
        background: linear-gradient(#c3cdcd, #a5b2b2);
        box-shadow: 0 20px 30px -16px rgba(6, 46, 46, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="monitor">
        <div class="bezel"><div class="screen" id="screen"></div></div>
        <div class="neck"></div>
        <div class="foot"></div>
      </div>
    </div>
    <script>
      // ?island=island.png&window=main.png
      const q = new URLSearchParams(location.search)
      const screen = document.getElementById('screen')
      if (q.get('window')) {
        screen.insertAdjacentHTML(
          'beforeend',
          `<div class="window"><div class="titlebar">Nod<div class="controls"><span>—</span><span>☐</span><span>✕</span></div></div><img src="${q.get('window')}"></div>`,
        )
      }
      screen.insertAdjacentHTML(
        'beforeend',
        `<div class="island"><img src="${q.get('island') || 'island.png'}"></div>`,
      )
      screen.insertAdjacentHTML(
        'beforeend',
        `<div class="taskbar"><span></span><span></span><span class="nod"></span><span></span><span></span></div>`,
      )
      if (q.get('windowWidth'))
        document.documentElement.style.setProperty('--window-w', `${q.get('windowWidth')}px`)
      if (q.get('islandWidth'))
        document.documentElement.style.setProperty('--island-w', `${q.get('islandWidth')}px`)
    </script>
  </body>
</html>
