name: Release

# Push a tag like v0.2.0 (see docs/development.md › Releasing).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  prepare:
    name: Create draft release
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        name: Check that the tag matches the code version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code="$(node -p "require('./package.json').version")"
          [ "$version" = "$code" ] || { echo "::error::Tag $version != package.json $code (run npm run version:set)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - id: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Nod ${{ steps.meta.outputs.version }}
          body_path: notes.md
          draft: true

  cli:
    name: CLI
    timeout-minutes: 10
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @nod/cli
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cli/dist/nod.mjs --clobber

  android:
    name: Android APK
    timeout-minutes: 30
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (docs/development.md)"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          NOD_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NOD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Nod-${{ needs.prepare.outputs.version }}.apk"
          gh release upload "$GITHUB_REF_NAME" "Nod-${{ needs.prepare.outputs.version }}.apk" --clobber

  desktop:
    name: Windows installer
    timeout-minutes: 45
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          save-if: false
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Checksums, provenance & publish
    timeout-minutes: 10
    needs: [prepare, cli, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signed build provenance
      attestations: write
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --pattern 'nod.mjs' --pattern '*.apk' --pattern '*.exe'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Lets anyone verify a download: gh attestation verify <file> --repo <owner>/nod
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Upload checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
