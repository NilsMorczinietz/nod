name: Installer preview

# Builds the Windows installer for any branch without publishing anything,
# e.g. to check installer branding: gh workflow run installer-preview.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          save-if: false
      - run: npm ci
      - name: Build the installer (unsigned updater artifacts are skipped)
        working-directory: desktop
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nod-installer-preview
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
