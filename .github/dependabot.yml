version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # TypeScript 7 (native compiler) is not supported by svelte-check yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    groups:
      gradle-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
