name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations: { required: true }
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [CLI / hooks, Relay, Android app, Windows app, Setup / docs]
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      description: '`nod version`, app version (Settings › About), `claude --version`, OS'
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: '`~/.local/state/nod/hook.log`, `npx wrangler tail`, or `adb logcat`. Remove tokens first.'
      render: text
